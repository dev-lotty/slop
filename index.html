<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--tx:#e9e5da;--txrgb:233,229,218;--bg:#131211;--brgb:19,18,17;--ac:#ff7a2b;--acrgb:255,122,43;--onac:#131211;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--serif:Georgia,"Times New Roman",serif;color-scheme:dark}
body.light{--tx:#1b1916;--txrgb:27,25,22;--bg:#efeadf;--brgb:239,234,223;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--tx);font-family:var(--mono);font-size:15px;line-height:1.4;min-height:100vh;padding:28px 18px 40px}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,8vw,46px);line-height:1;margin:0;letter-spacing:-.02em}
h1 span{font-family:var(--mono);font-weight:400;font-size:.38em;letter-spacing:0;color:var(--ac);margin-left:.5em;vertical-align:.9em}
.sub{margin:8px 0 26px;opacity:.55}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.nav{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin-bottom:22px;padding-bottom:10px;border-bottom:1px solid rgba(var(--txrgb),.2)}
.tab{opacity:.5;padding:2px 0;border-bottom:2px solid transparent}
.tab:hover{opacity:1}
.tab.on{opacity:1;border-bottom-color:var(--ac)}
#snd{margin-left:auto;opacity:.5}
#snd:hover{opacity:1}
.panel{display:none}
.panel.show{display:block}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.reels.shake{animation:shake .32s}
@keyframes shake{15%{transform:translate(-4px,2px)}35%{transform:translate(4px,-2px)}55%{transform:translate(-3px,-1px)}75%{transform:translate(2px,2px)}100%{transform:none}}
.lb{font-size:12px;opacity:.5;margin-bottom:6px}
.rw{height:126px;overflow:hidden;position:relative;background:rgba(var(--txrgb),.06);border-radius:3px}
.rw::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(var(--brgb),.92) 0%,rgba(var(--brgb),0) 36%,rgba(var(--brgb),0) 64%,rgba(var(--brgb),.92) 100%)}
.sel{position:absolute;left:0;right:0;top:42px;height:42px;border-top:2px solid var(--ac);border-bottom:2px solid var(--ac);z-index:2;pointer-events:none}
.strip{will-change:transform}
.strip.blur{filter:blur(1.5px)}
.c{height:42px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8px;font-family:var(--serif);font-weight:700;font-size:clamp(14px,4.2vw,21px);line-height:1.05;overflow:hidden;word-break:break-word}
.c.f{background:var(--ac);color:var(--onac)}
.rw.thud{animation:thud .3s}
@keyframes thud{30%{transform:translateY(6px)}65%{transform:translateY(-2px)}100%{transform:none}}
#go{background:var(--ac);color:var(--onac);padding:12px 30px;font-weight:700;font-size:17px;box-shadow:4px 4px 0 rgba(var(--txrgb),.9);transition:transform .06s,box-shadow .06s}
#go:active{transform:translate(4px,4px);box-shadow:0 0 0 rgba(var(--txrgb),.9)}
#go:disabled{opacity:.55;cursor:wait;transform:translate(4px,4px);box-shadow:none}
#out{font-family:var(--serif);font-size:clamp(26px,7.5vw,40px);line-height:1.1;margin:30px 0 16px;min-height:2.3em;letter-spacing:-.01em;word-break:break-word}
#out i{font-style:normal;color:var(--ac);font-family:var(--mono);font-size:.7em;margin-right:.3em}
.lk{opacity:.6;text-decoration:underline;text-underline-offset:3px}
.lk:hover{opacity:1}
.meta{margin-top:26px;opacity:.45;font-size:13px}
.meta b{font-weight:400;display:inline-block}
.meta b.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.5);color:var(--ac)}}
#list{list-style:none;padding:0;margin:0 0 14px}
#list li{padding:9px 0;border-bottom:1px solid rgba(var(--txrgb),.14);cursor:pointer;font-family:var(--serif);font-size:19px}
#list li span{font-family:var(--mono);font-size:12px;opacity:.4;margin-right:12px}
#list li:hover{color:var(--ac)}
.empty{opacity:.5;cursor:default!important;font-family:var(--mono)!important;font-size:15px!important}
label{display:block;margin:18px 0 5px;font-size:12px;opacity:.55}
textarea{display:block;width:100%;height:120px;background:rgba(var(--txrgb),.06);color:inherit;border:0;border-radius:3px;font:14px/1.45 var(--mono);padding:10px;resize:vertical}
textarea:focus{outline:2px solid var(--ac)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%}
.sw button.sel2{outline:2px solid var(--tx);outline-offset:3px}
input[type=color]{width:56px;height:30px;background:none;border:0;padding:0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ac)}
.opts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:20px}
.pill{border:1px solid rgba(var(--txrgb),.35);border-radius:99px;padding:4px 14px}
.pill:hover{border-color:var(--ac);color:var(--ac)}
footer{margin-top:50px;padding-top:14px;border-top:1px solid rgba(var(--txrgb),.2);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
footer .cr{margin-left:auto;opacity:.5}
footer a{color:inherit}
.pu{display:none;position:fixed;z-index:30;width:min(92vw,420px);background:var(--bg);border:2px solid var(--tx);box-shadow:8px 8px 0 rgba(var(--txrgb),.9)}
.pu.in{animation:pin .35s}
@keyframes pin{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.pt{display:flex;justify-content:space-between;align-items:center;background:var(--ac);color:var(--onac);padding:4px 6px 4px 10px;font-weight:700;font-size:13px;cursor:move;touch-action:none;user-select:none}
.pt button{padding:0 8px;font-weight:700;border:1.5px solid var(--onac)}
.pt button:hover{background:var(--onac);color:var(--ac)}
.pb{display:flex;gap:14px;align-items:center;padding:20px 16px}
.pi{font-size:36px;font-weight:700;color:var(--ac);white-space:nowrap}
.pm{font-family:var(--serif);font-size:clamp(21px,6vw,28px);line-height:1.1;word-break:break-word}
.pbt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 14px 18px}
.pbt button{border:1.5px solid var(--tx);padding:5px 14px}
.pbt button:hover{background:var(--tx);color:var(--bg)}
.p{position:fixed;z-index:40;pointer-events:none;font-weight:700;color:var(--ac);animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>slop generator<span>9003.56</span></h1>
  <p class="sub">makes ideas. most of them are bad.</p>

  <nav class="nav">
    <button class="tab on" data-t="spin">spin</button>
    <button class="tab" data-t="ideas">ideas</button>
    <button class="tab" data-t="words">words</button>
    <button class="tab" data-t="style">style</button>

  </nav>

  <section class="panel show" id="p-spin">
    <div class="reels" id="reels">
      <div><div class="lb">verb</div><div class="rw" id="w0"><div class="sel"></div><div class="strip" id="s0"></div></div></div>

    <label>articles</label><textarea id="t1"></textarea>
    <label>nouns</label><textarea id="t2"></textarea>

  <footer>
    <button class="lk" id="dc">discord</button>

</div>

<div class="pu" id="pu" role="alertdialog">
  <div class="pt" id="pt"><span id="ptt">warning</span><button id="px" aria-label="close">x</button></div>
  <div class="pb"><div class="pi">!</div><div class="pm" id="pm"></div></div>
  <div class="pbt"><button id="pok">ok</button><button id="pcp">copy idea</button><button id="pro">spin again</button></div>
</div>

<script>
var base=[
["Become","Eat","Summon","Befriend","Sell","Escape","Fight","Marry","Hack","Adopt","Banish","Worship","Clone","Haunt","Defeat","Ride","Steal","Invent","Cancel","Smuggle"],
["the","a","our","my","your","every","no","one","some","that","another","their"],
["Garden","Toaster","Goose","Lawnmower","Haunted Pizza","Dragon","Sock","Mayor","Volcano","Hamster","Skeleton","Wi-Fi","Vending Machine","Cousin","Moon","Wizard","Parking Lot","Pigeon","Raccoon","Lighthouse"]
];
var DEF={color:"#ff7a2b",sound:true,vol:60,light:false,popup:true};
function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
var words=ld("sw",JSON.parse(JSON.stringify(base))),ideas=ld("si",[]),total=ld("sn",0);
var cfg=ld("scfg",null)||JSON.parse(JSON.stringify(DEF));
if(cfg.popup===undefined)cfg.popup=true;
var cur=ld("scur",["Become","our","Garden"]);
var nb=[0,1,2].map(function(i){return[pick(words[i]),pick(words[i])]});
var RH=42,busy=false,AC=null,master=null,tw=null,dr=null;
var go=document.getElementById("go"),o=document.getElementById("o"),reels=document.getElementById("reels"),pu=document.getElementById("pu");
var strips=[0,1,2].map(function(i){return document.getElementById("s"+i)});
var wins=[0,1,2].map(function(i){return document.getElementById("w"+i)});
function sentence(a){var s=a.join(" ").toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)+"."}
function cell(t,c){var d=document.createElement("div");d.className="c"+(c?" "+c:"");d.textContent=t;return d}
function rest(i){
  var s=strips[i];s.style.transition="none";s.style.transform="translateY(0)";s.textContent="";
  s.appendChild(cell(nb[i][0]));s.appendChild(cell(cur[i],"mid"));s.appendChild(cell(nb[i][1]));
}
/* audio */
function ac(){
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination)}
  if(AC.state=="suspended")AC.resume();
  master.gain.value=cfg.vol/100;return AC;
}
function tone(f,t,d,type,v,fe){
  var c=ac(),os=c.createOscillator(),g=c.createGain(),t0=c.currentTime+(t||0);
  os.type=type||"square";os.frequency.setValueAtTime(f,t0);
  if(fe)os.frequency.exponentialRampToValueAtTime(fe,t0+d);
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  os.connect(g);g.connect(master);os.start(t0);os.stop(t0+d+.02);
}
function noise(t,d,v,hp){
  var c=ac(),len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),a=b.getChannelData(0);
  for(var i=0;i<len;i++)a[i]=Math.random()*2-1;
  var s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t0=c.currentTime+(t||0);
  s.buffer=b;f.type="highpass";f.frequency.value=hp||1500;
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);
}
function sfx(n,a){
  if(!cfg.sound)return;
  try{
    if(n=="click"){tone(240,0,.06,"square",.25,90);noise(0,.03,.12,3000)}
    else if(n=="tab"){tone(660,0,.05,"triangle",.3,880)}
    else if(n=="pull"){tone(180,0,.35,"sawtooth",.12,900);noise(0,.25,.08,2500);tone(120,0,.08,"square",.3,60)}
    else if(n=="tick"){tone(950-a*450,0,.03,"triangle",.4);noise(0,.012,.18,4000)}
    else if(n=="thunk"){tone(150+a*35,0,.2,"sine",.95,42);noise(0,.06,.35,500);tone(900+a*120,0,.04,"square",.12)}
    else if(n=="chime"){[523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){tone(f,i*.07,.45,"triangle",.32);tone(f*2,i*.07,.25,"sine",.1)});noise(.34,.25,.1,6000)}
    else if(n=="type"){tone(1100+Math.random()*400,0,.02,"square",.07)}
    else if(n=="copy"){tone(880,0,.06,"triangle",.3);tone(1320,.06,.12,"triangle",.3)}
    else if(n=="err"){tone(520,0,.14,"square",.3,260);tone(520,.17,.14,"square",.3,260);noise(0,.05,.15,2000)}
    else if(n=="pick"){tone(500+Math.random()*500,0,.05,"triangle",.3)}
  }catch(e){}
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
/* juice */
function burst(el,n,big){
  var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,ch="*#%@$&+=~?!";
  for(var i=0;i<n;i++){
    var p=document.createElement("span"),a=Math.random()*6.283,d=(big?120:70)*(.5+Math.random());
    p.className="p";p.textContent=ch.charAt(Math.floor(Math.random()*ch.length));
    p.style.left=cx+"px";p.style.top=cy+"px";p.style.fontSize=(14+Math.random()*(big?20:10))+"px";
    p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d+30+"px");p.style.setProperty("--r",(Math.random()*360-180)+"deg");
    document.body.appendChild(p);
    (function(p){setTimeout(function(){p.remove()},850)})(p);
  }
}
function cls(el,c,ms){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(function(){el.classList.remove(c)},ms)}
function typeIt(txt){
  clearInterval(tw);var i=0;o.textContent="";
  tw=setInterval(function(){o.textContent=txt.slice(0,++i);if(i%2)sfx("type");if(i>=txt.length)clearInterval(tw)},32);
}
function setCnt(bump){
  var c=document.getElementById("cnt");c.textContent=total;
  if(bump)cls(c,"bump",320);
}
function copy(t,b,label){
  try{navigator.clipboard.writeText(t)}catch(e){}
  sfx("copy");
  if(b){b.textContent="copied!";setTimeout(function(){b.textContent=label},900)}
}
/* spin */
function run(){
  if(busy)return;busy=true;
  go.disabled=true;go.textContent="spinning...";clearInterval(tw);o.textContent="";
  sfx("pull");buzz(15);
  var left=3;
  [0,1,2].forEach(function(i){
    var L=words[i],s=strips[i],fin=pick(L),fa=pick(L),fb=pick(L),k=18+i*8,dur=1700+i*650;
    s.textContent="";
    s.appendChild(cell(nb[i][0]));s.appendChild(cell(cur[i]));s.appendChild(cell(nb[i][1]));
    while(k--)s.appendChild(cell(pick(L)));
    s.appendChild(cell(fa));s.appendChild(cell(fin));s.appendChild(cell(fb));
    var n=s.children.length;
    s.style.transition="none";s.style.transform="translateY(0)";void s.offsetWidth;
    s.classList.add("blur");
    s.style.transition="transform "+dur+"ms cubic-bezier(.12,.72,.18,1)";
    s.style.transform="translateY(-"+((n-3)*RH)+"px)";
    for(var t=1;t<=18;t++)(function(t){setTimeout(function(){sfx("tick",t/18)},dur*Math.pow(t/18,2)*.93)})(t);
    setTimeout(function(){s.classList.remove("blur")},dur*.72);
    setTimeout(function(){
      cur[i]=fin;nb[i]=[fa,fb];rest(i);
      var mid=s.children[1];mid.classList.add("f");
      setTimeout(function(){mid.classList.remove("f")},280);
      cls(wins[i],"thud",320);sfx("thunk",i);buzz(20);burst(wins[i],7,false);
      if(--left==0){
        cls(reels,"shake",340);burst(wins[i],22,true);
        busy=false;go.disabled=false;go.textContent="spin";
        var r=sentence(cur);
        setTimeout(function(){sfx("chime");buzz([30,40,60]);typeIt(r)},150);
        if(cfg.popup)setTimeout(function(){showPopup(r)},1100);
        ideas.unshift(r);ideas=ideas.slice(0,50);sv("si",ideas);sv("scur",cur);
        total++;sv("sn",total);setCnt(true);drawList();
      }
    },dur+60);
  });
}
/* popup */
var PT=["virus detected","you won!!","error 404: taste not found","your pc is slopped","fatal idea exception","free robux (real)","windows has found slop"];
function showPopup(t){
  document.getElementById("pm").textContent=t;
  document.getElementById("ptt").textContent=pick(PT);
  pu.style.display="block";
  var w=pu.offsetWidth,h=pu.offsetHeight;
  pu.style.left=Math.max(8,(innerWidth-w)/2+Math.random()*80-40)+"px";
  pu.style.top=Math.max(8,(innerHeight-h)/2+Math.random()*80-40)+"px";
  cls(pu,"in",360);sfx("err");buzz([40,30,40]);
}
function closePopup(){if(pu.style.display=="block"){pu.style.display="none";sfx("click")}}
document.getElementById("px").onclick=closePopup;
document.getElementById("pok").onclick=closePopup;
document.getElementById("pcp").onclick=function(){copy(sentence(cur),this,"copy idea")};
document.getElementById("pro").onclick=function(){closePopup();run()};
document.getElementById("pt").addEventListener("pointerdown",function(e){
  if(e.target.tagName=="BUTTON")return;
  var r=pu.getBoundingClientRect();dr=[e.clientX-r.left,e.clientY-r.top];e.preventDefault();
});
document.addEventListener("pointermove",function(e){
  if(!dr)return;
  pu.style.left=Math.max(0,Math.min(innerWidth-pu.offsetWidth,e.clientX-dr[0]))+"px";
  pu.style.top=Math.max(0,Math.min(innerHeight-pu.offsetHeight,e.clientY-dr[1]))+"px";
});
document.addEventListener("pointerup",function(){dr=null});
/* ideas + tabs */
function drawList(){
  var ul=document.getElementById("list");ul.textContent="";
  if(!ideas.length){var d=document.createElement("li");d.className="empty";d.textContent="nothing yet. go spin.";ul.appendChild(d);return}
  ideas.forEach(function(s,i){
    var li=document.createElement("li"),n=document.createElement("span");
    n.textContent=("00"+(ideas.length-i)).slice(-2);li.appendChild(n);li.appendChild(document.createTextNode(s));
    li.onclick=function(){copy(s);li.textContent="copied!";setTimeout(drawList,700)};
    ul.appendChild(li);
  });
}
function tab(t){
  Array.prototype.forEach.call(document.querySelectorAll(".panel"),function(p){p.classList.toggle("show",p.id=="p-"+t)});
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.classList.toggle("on",b.dataset.t==t)});
  sfx("tab");
}
Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){tab(b.dataset.t)}});
/* words */
for(var q=0;q<3;q++)(function(i){
  var ta=document.getElementById("t"+i);ta.value=words[i].join("\n");
  ta.oninput=function(){
    var a=ta.value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
    words[i]=a.length?a:base[i];sv("sw",words);
  };
})(q);
document.getElementById("reset").onclick=function(){
  words=JSON.parse(JSON.stringify(base));sv("sw",words);sfx("click");
  for(var i=0;i<3;i++)document.getElementById("t"+i).value=words[i].join("\n");
};
/* style */
var COLORS=["#ff7a2b","#ffd23f","#b8f23c","#3ddc97","#4dd0ff","#6f8cff","#b78cff","#ff5fa2","#ff4d4d","#e9e5da"];
function hex2rgb(h){var n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function applyCfg(){
  var c=hex2rgb(cfg.color),lum=.299*c[0]+.587*c[1]+.114*c[2],s=document.documentElement.style;
  s.setProperty("--ac",cfg.color);s.setProperty("--acrgb",c.join(","));s.setProperty("--onac",lum>140?"#131211":"#ffffff");
  document.body.classList.toggle("light",!!cfg.light);
  document.getElementById("snd").textContent="sound "+(cfg.sound?"on":"off");
  document.getElementById("mode").textContent="mode: "+(cfg.light?"light":"dark");
  document.getElementById("pop").textContent="popup: "+(cfg.popup?"on":"off");
  document.getElementById("vol").value=cfg.vol;
  document.getElementById("cp").value=cfg.color;
  Array.prototype.forEach.call(document.querySelectorAll("#sw button"),function(b){b.classList.toggle("sel2",b.dataset.c==cfg.color)});
  sv("scfg",cfg);
}
COLORS.forEach(function(c){
  var b=document.createElement("button");b.style.background=c;b.dataset.c=c;b.title=c;
  b.onclick=function(){cfg.color=c;applyCfg();sfx("pick")};
  document.getElementById("sw").appendChild(b);
});
document.getElementById("cp").oninput=function(){cfg.color=this.value;applyCfg()};
document.getElementById("vol").oninput=function(){cfg.vol=+this.value;applyCfg();if(AC)master.gain.value=cfg.vol/100};
document.getElementById("vol").onchange=function(){sfx("copy")};
document.getElementById("mode").onclick=function(){cfg.light=!cfg.light;applyCfg();sfx("click")};
document.getElementById("pop").onclick=function(){cfg.popup=!cfg.popup;applyCfg();sfx("click")};
document.getElementById("rs").onclick=function(){cfg=JSON.parse(JSON.stringify(DEF));applyCfg();sfx("click")};
document.getElementById("snd").onclick=function(){cfg.sound=!cfg.sound;applyCfg();sfx("copy")};
/* misc */
document.getElementById("clear").onclick=function(){ideas=[];sv("si",ideas);drawList();sfx("click")};
document.getElementById("copy").onclick=function(){copy(sentence(cur),this,"copy idea")};
document.getElementById("dc").onclick=function(){copy(".lty_",this,"discord")};
go.onclick=run;
document.addEventListener("keydown",function(e){
  if(e.code=="Escape")closePopup();
  if(e.code=="Space"&&!/TEXTAREA|BUTTON|INPUT/.test(e.target.tagName)&&document.getElementById("p-spin").classList.contains("show")){e.preventDefault();run()}
});
applyCfg();
o.textContent=sentence(cur);
for(var z=0;z<3;z++)rest(z);
setCnt(false);drawList();
</script>
</body>
</html>
